<div class="frontmatter">
  
  {{ with time .Params.created }}
    <i>Created: <time class="dt-published" datetime="{{ . }}">{{ .Format "02 Jan 2006" }}</time></i>
  {{ end }}

  {{ with index .Params "last updated" }}
    {{ with time . }}
      <i>Last updated: <time class="dt-updated" datetime="{{ . }}">{{ .Format "02 Jan 2006" }}</time></i>
    {{ end }}
  {{ end }}

</div>
